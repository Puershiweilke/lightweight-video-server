<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量级私人视频服务站</title>
    <style>
        /* 响应式基础框架  */
        :root {
            --primary-color: #2196F3;
            --card-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui;
            background: #f5f5f5;
        }

        /* 导航栏  、*/
        .navbar {
            background: #fff;
            padding: 1rem;
            box-shadow: var(--card-shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .search-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
        }

        #search {
            flex: 1;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        #sort {
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        /* 视频网格系统 */
        .video-grid {
            display: grid;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .video-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
        }

        .thumbnail {
            position: relative;
            padding-top: 56.25%; /* 16:9比例 */
            background: #000;
        }

        .thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .thumbnail img.loaded {
            opacity: 1;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            cursor: pointer;
        }

        .play-btn::before {
            content: '▶';
            color: white;
            font-size: 24px;
        }

        /* 视频元信息  */
        .meta {
            padding: 1rem;
        }

        .meta h3 {
            margin-bottom: 0.5rem;
            color: #333;
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.9rem;
        }

        /* 响应式断点 */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            
            .search-container {
                flex-direction: column;
            }
        }

        /* 微调 */
       .thumbnail img {
            display: none;
        }

       .thumbnail{
          padding-top: 20%;
       }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="search-container">
            <input type="text" id="search" placeholder="搜索视频...">
            <select id="sort">
                <option value="created">最新上传</option>
                <option value="size">文件大小</option>
            </select>
        </div>
    </nav>

    <div class="video-grid" id="videoContainer"></div>

    <script>
        // 防抖函数
        const debounce = (func, delay = 300) => {
            let timeout;
            return (...args) => {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        };

        // 懒加载观察器
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src;
                    img.classList.add('loaded');
                    observer.unobserve(img);
                }
            });
        }, { rootMargin: '100px' });

        // 加载视频数据 (对接你的/api/videos接口)
        async function loadVideos(params = {}) {
            try {
                const query = new URLSearchParams(params);
                const response = await fetch(`/api/videos?${query}`);
                const videos = await response.json();
                
                const container = document.getElementById('videoContainer');
                container.innerHTML = videos.map(video => `
                    <div class="video-card">
                        <div class="thumbnail">
                            <img 
                                data-src="/placeholder.jpg" 
                                class="lazy-load"
                                alt="${video.name}"
                            >
                            <button class="play-btn" 
                                onclick="playVideo('${video.url}')"></button>
                        </div>
                        <div class="meta">
                            <h3>${video.name}</h3>
                            <div class="stats">
                                <span>${(video.size/1024/1024).toFixed(1)}MB</span>
                                <span>${new Date(video.created).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                // 初始化懒加载
                document.querySelectorAll('.lazy-load').forEach(img => observer.observe(img));
            } catch (error) {
                console.error('数据加载失败:', error);
            }
        }

        // 播放视频功能 
        function playVideo(url) {
            const player = document.createElement('video');
            player.src = url;
            player.controls = true;
            player.style.width = '100%';
            
            const container = document.getElementById('videoContainer');
            container.prepend(player);
            player.scrollIntoView({ behavior: 'smooth' });
        }

        // 事件监听
        document.getElementById('search').addEventListener('input', 
            debounce(e => loadVideos({ search: e.target.value }))
        );

        document.getElementById('sort').addEventListener('change', 
            e => loadVideos({ sort: e.target.value })
        );

        // 初始化加载
        loadVideos();
    </script>
</body>
</html>
